<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div & span tag</title>
    <style>
        .card{
            background-color: rgb(222, 135, 135);
        }
        .highlight{
            background-color: rgb(0, 255, 213);
        }
    </style>
</head>
<body>
    <p>div tag: block level element</p>
    <p>span tag: inline level element</p>
    <div class="card">
        <h2>Product Card</h2>
        <p>The product is beautiful and the best part is its <span class="highlight"> on sale</span></p>
    </div>
</body>
</html>
